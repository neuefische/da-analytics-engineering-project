version: 2

sources:
  - name: weather_data
    schema: crush
    tables:
      - name: weather_raw  # <--logical name used in the models
        identifier: weather_data_raw # <-- actual physical table queried

  - name: flights_data
    schema: crush
    tables:
      - name: flights_raw
        identifier: flights_200302

# This is for documentation purposes, ALWAYS DOCUMENT!
models:
  - name: staging_weather
    description: "Flattened daily weather data from the raw JSON source."
    columns:
      - name: airport_code
        description: "IATA airport code."
      - name: station_id
        description: "Weather station identifier."
